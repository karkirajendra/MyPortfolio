# App lives in my-portfolio/ (not the repo root)
[build]
  base = "my-portfolio"
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Browser stays on the Netlify domain; API + uploads are proxied to Render.
[[redirects]]
  from = "/api/*"
  to = "https://myportfolio-jv2c.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://myportfolio-jv2c.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/google"
  to = "https://myportfolio-jv2c.onrender.com/auth/google"
  status = 200
  force = true

[[redirects]]
  from = "/auth/google/*"
  to = "https://myportfolio-jv2c.onrender.com/auth/google/:splat"
  status = 200
  force = true

# SPA fallback — always serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
